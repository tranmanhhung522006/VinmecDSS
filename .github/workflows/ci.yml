name: static-checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    # Valid schema URLs only. CI never connects to a real database or uses deployment secrets.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/vinmec_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/vinmec_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --include=dev
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run test
      - run: npm run build
