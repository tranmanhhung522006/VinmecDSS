name: static-checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --include=dev
        env:
          NODE_ENV: production
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run test
      - run: npm run build