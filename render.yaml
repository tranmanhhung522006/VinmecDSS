services:
  - type: web
    name: vinmec-dss
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:push && npm run db:seed && npm run start -w @vinmec/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AI_MAX_CALLS
        value: "20"