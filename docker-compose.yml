services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vinmec_dss
      POSTGRES_USER: dss
      POSTGRES_PASSWORD: local_demo_password
    ports: ["5433:5432"]
    volumes: ["dss_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss -d vinmec_dss"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dss_pgdata: